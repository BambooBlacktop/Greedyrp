<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>greedyrp LIVE reactions</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}#stage{position:fixed;inset:0;pointer-events:none}.heart{position:absolute;bottom:-12vh;font-size:clamp(38px,5vw,84px);filter:drop-shadow(0 5px 6px #6d1b5b99);animation:floatUp 4.2s ease-in forwards}.sticker{position:absolute;left:50%;top:20%;transform:translateX(-50%) rotate(-4deg);padding:22px 38px;border:6px solid #fff;border-radius:28px;background:linear-gradient(135deg,#ff8ec5,#b681ff);color:#fff;text-align:center;font-size:clamp(26px,3.7vw,58px);font-weight:900;text-shadow:0 4px #6e357d;box-shadow:0 12px 25px #3d135477;animation:sticker 4s ease forwards}.gift{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.55);width:min(72vw,900px);padding:42px;border:9px solid #fff7c3;border-radius:42px;background:radial-gradient(circle at top,#ffe76c,#ff679f 48%,#7851ff);color:#fff;text-align:center;box-shadow:0 0 45px 18px #ffdb59bb;animation:gift 5s cubic-bezier(.16,.84,.35,1) forwards}.gift .icon{font-size:clamp(70px,10vw,180px);line-height:1}.gift .title{font-size:clamp(28px,4vw,70px);font-weight:1000;text-shadow:0 5px #7d296e}.gift .detail{margin-top:10px;font-size:clamp(19px,2.1vw,34px);font-weight:800}.legendary{animation-duration:6s;background:radial-gradient(circle at top,#fff9ad,#ff9d34 34%,#ff2b79 65%,#783cff);box-shadow:0 0 70px 30px #fff17c}@keyframes floatUp{0%{transform:translateY(0) scale(.45) rotate(-12deg);opacity:0}12%{opacity:1}84%{opacity:1}100%{transform:translateY(-120vh) scale(1.15) rotate(18deg);opacity:0}}@keyframes sticker{0%{opacity:0;transform:translateX(-50%) scale(.25) rotate(-15deg)}16%,78%{opacity:1;transform:translateX(-50%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translateX(-50%) scale(.84) rotate(4deg)}}@keyframes gift{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-8deg)}14%,80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.16) rotate(5deg)}}
</style></head><body><main id="stage"></main><script>
const stage=document.querySelector('#stage');let lastId=0;const hearts=['💗','💖','💕','🩷','✨'];function heart(amount=1){for(let i=0;i<Math.min(amount,12);i++){const el=document.createElement('div');el.className='heart';el.textContent=hearts[Math.floor(Math.random()*hearts.length)];el.style.left=(4+Math.random()*90)+'%';el.style.animationDelay=(i*.08)+'s';stage.append(el);setTimeout(()=>el.remove(),5000)}}function escapeHtml(s){const d=document.createElement('div');d.textContent=String(s||'viewer');return d.innerHTML}function follow(name){const el=document.createElement('div');el.className='sticker';el.innerHTML='✨ '+escapeHtml(name)+' FOLLOWED! ✨<br><span style="font-size:.52em">Welcome to the squad</span>';stage.append(el);heart(10);setTimeout(()=>el.remove(),4300)}function gift(e){const big=(e.diamonds||0)>=1000,medium=(e.diamonds||0)>=100;const el=document.createElement('div');el.className='gift'+(big?' legendary':'');const headline=big?'LEGENDARY GIFT!':medium?'MEGA GIFT!':'GIFT DROP!';el.innerHTML='<div class="icon">'+(big?'👑':medium?'🎁':'💝')+'</div><div class="title">'+headline+'</div><div class="detail">'+escapeHtml(e.user)+' sent '+escapeHtml(e.name||'a gift')+' ×'+(e.repeats||1)+'</div>';stage.append(el);heart(big?24:medium?16:8);setTimeout(()=>el.remove(),6500)}function react(e){lastId=Math.max(lastId,e.id||0);if(e.type==='like')heart(Math.max(1,Math.ceil((e.count||1)/2)));else if(e.type==='follow')follow(e.user);else if(e.type==='gift')gift(e)}async function poll(){try{const res=await fetch('/events?after='+lastId,{cache:'no-store'});const data=await res.json();(data.events||[]).forEach(react)}catch(_){}setTimeout(poll,650)}poll();
</script></body></html>

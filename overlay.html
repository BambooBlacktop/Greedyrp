<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rice Field LIVE</title><style>
:root{--ink:#3d2516}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Trebuchet MS,Arial,sans-serif;background:#183b1d}#farm{position:fixed;inset:0;background:url('/rice-field-live-background.png') center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(#10281844,transparent 32%,transparent 75%,#10281844)}#sign{position:absolute;top:3.3%;left:50%;transform:translateX(-50%);width:58%;text-align:center;color:#fff8dd;font-size:clamp(22px,3.8vw,50px);font-weight:1000;letter-spacing:1px;text-shadow:0 4px #59331d,0 8px 12px #2a160a99}.stats{position:absolute;top:12%;left:50%;transform:translateX(-50%);display:flex;gap:10px}.pill{background:#fff7dccc;border:3px solid #855832;border-radius:99px;padding:7px 15px;color:var(--ink);font-weight:900;font-size:clamp(13px,1.8vw,22px);box-shadow:0 3px 0 #55351d}.farmers{position:absolute;left:13%;right:13%;bottom:15%;top:37%}.farmer{position:absolute;font-size:clamp(28px,4.4vw,62px);filter:drop-shadow(0 4px 2px #1e3b1caa);animation:arrive .5s cubic-bezier(.1,.9,.35,1);transform-origin:center bottom}.farmer.working{animation:work 1.05s ease-in-out infinite alternate}.farmer .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);padding:2px 6px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:8px;background:#fff9e7dd;color:#4d321d;font-size:10px;font-weight:900}.toast{position:absolute;left:50%;top:26%;transform:translateX(-50%) scale(.4);width:min(76vw,800px);padding:20px;border:6px solid #fff4bb;border-radius:28px;background:linear-gradient(135deg,#e97155,#ffca47);color:#fff;text-align:center;text-shadow:0 3px #813928;box-shadow:0 8px 0 #87432d,0 15px 28px #431b1c99;opacity:0;animation:toast 4s ease forwards}.toast.big{background:linear-gradient(135deg,#9a5df4,#ff74ad,#ffd854);border-width:8px;animation-duration:5.5s}.toast .icon{font-size:clamp(44px,8vw,104px);line-height:1}.toast .title{font-size:clamp(23px,4vw,57px);font-weight:1000}.toast .sub{font-size:clamp(13px,2vw,25px);font-weight:800;margin-top:5px}.heart,.leaf,.drop,.spark{position:absolute;pointer-events:none;animation:float 4s ease-out forwards}.heart{font-size:clamp(24px,4vw,55px)}.leaf{font-size:clamp(20px,3vw,44px)}.drop{font-size:clamp(24px,4vw,52px);animation:rain 1.4s ease-in forwards}.spark{font-size:clamp(24px,4vw,58px);animation:pop 1.8s ease-out forwards}@keyframes arrive{0%{opacity:0;transform:scale(.1) translateY(80px)}100%{opacity:1;transform:scale(1) translateY(0)}}@keyframes work{to{transform:rotate(-7deg) translateY(3px)}}@keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.4) rotate(-8deg)}15%,78%{opacity:1;transform:translateX(-50%) scale(1) rotate(0)}100%{opacity:0;transform:translateX(-50%) scale(.92) rotate(4deg)}}@keyframes float{0%{opacity:0;transform:translateY(0) scale(.4)}14%,80%{opacity:1}100%{opacity:0;transform:translateY(-60vh) rotate(18deg) scale(1.2)}}@keyframes rain{0%{opacity:0;transform:translateY(-15vh)}15%,80%{opacity:1}100%{opacity:0;transform:translateY(40vh)}}@keyframes pop{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.5) rotate(35deg)}}
</style></head><body><main id="farm"><div class="shade"></div><div id="sign">🌾 RICE FIELD LIVE 🌾</div><div class="stats"><div class="pill">👩‍🌾 FARMERS <span id="farmerCount">0</span></div><div class="pill">🌾 HARVEST <span id="harvest">0</span></div></div><div id="farmers" class="farmers"></div></main><script>
const root=document.querySelector('#farm'),farmers=document.querySelector('#farmers'),count=document.querySelector('#farmerCount'),harvestEl=document.querySelector('#harvest');let last=0;let state=JSON.parse(localStorage.getItem('rice-live-state')||'{"farmers":[],"harvest":0}');const safe=s=>{const d=document.createElement('div');d.textContent=s||'viewer';return d.innerHTML};function save(){localStorage.setItem('rice-live-state',JSON.stringify(state));count.textContent=state.farmers.length;harvestEl.textContent=state.harvest}function pos(i){return{left:(6+(i*29)%87)+'%',top:(8+(i*37)%79)+'%'}}function addFarmer(name){if(state.farmers.some(x=>x.name===name))return;state.farmers.push({name,icon:state.farmers.length%2?'👩🏽‍🌾':'👨🏾‍🌾'});render();toast('🌱 NEW RICE FARMER!','Welcome '+name+' to the field');save()}function render(){farmers.innerHTML='';state.farmers.forEach((f,i)=>{const e=document.createElement('div'),p=pos(i);e.className='farmer working';e.style.left=p.left;e.style.top=p.top;e.innerHTML='<span class="tag">'+safe(f.name)+'</span>'+f.icon;farmers.append(e)})}function burst(symbol,n,kind='heart'){for(let i=0;i<n;i++){const e=document.createElement('div');e.className=kind;e.textContent=symbol;e.style.left=(4+Math.random()*92)+'%';e.style.top=(42+Math.random()*47)+'%';e.style.animationDelay=(i*.06)+'s';root.append(e);setTimeout(()=>e.remove(),4500)}}function toast(title,sub,big=false){const e=document.createElement('div');e.className='toast'+(big?' big':'');e.innerHTML='<div class="icon">'+(big?'🏯':'🍚')+'</div><div class="title">'+title+'</div><div class="sub">'+safe(sub)+'</div>';root.append(e);setTimeout(()=>e.remove(),5800)}function feed(e){state.harvest+=15;save();toast('🍱 FARMERS FED! ',e.user+' sent '+e.name+' — harvest +15');burst('🍙',13,'leaf')}function water(e){state.harvest+=25;save();toast('💧 PADDIES WATERED!',e.user+' sent '+e.name+' — harvest +25');burst('💧',18,'drop')}function mega(e){state.harvest+=100;save();toast('🌟 GOLDEN HARVEST!',e.user+' sent '+e.name+' — harvest +100!',true);burst('🌾',26,'spark')}function gift(e){const n=(e.name||'').toLowerCase(),d=e.diamonds||0;if(/rose|flower|tulip|sunflower/.test(n))feed(e);else if(/heart|hand|ice|water|love/.test(n))water(e);else if(d>=1000||/lion|universe|rocket|whale|tiktok/.test(n))mega(e);else{state.harvest+=8;save();toast('🎁 FARM SUPPLIES!',e.user+' sent '+e.name+' — harvest +8');burst('🌾',10,'leaf')}}function react(e){last=Math.max(last,e.id||0);if(e.type==='follow')addFarmer(e.user);else if(e.type==='like')burst('💚',Math.min(10,Math.ceil((e.count||1)/2)));else if(e.type==='gift')gift(e)}async function poll(){try{const r=await fetch('/events?after='+last,{cache:'no-store'}),d=await r.json();(d.events||[]).forEach(react)}catch(_){}setTimeout(poll,650)}render();save();poll();
</script></body></html>
